<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agus Consolas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1726;--panel:#2a2338;--panel2:#352c47;--edge:#4a3f60;--line:#0e0b14;
  --ink:#f3eee2;--dim:#a79fb8;--acc:#b6ff3a;--acc2:#ff4fa0;--gold:#ffd23f;--red:#ff5a5a;--cyan:#5ef0ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'VT323',ui-monospace,Menlo,monospace;font-size:20px;line-height:1.15}
body{background-image:radial-gradient(#ffffff08 1px,transparent 1px);background-size:6px 6px}
.p2{font-family:'Press Start 2P',ui-monospace,monospace}
canvas.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
#app{max-width:1440px;margin:0 auto;padding:10px 16px 30px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}
h1{font-family:'Press Start 2P',monospace;font-size:18px;margin:0 8px 0 0;color:var(--acc);text-shadow:3px 3px 0 #000;white-space:nowrap}
h1 span{color:var(--acc2)}
#stats{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.stat{background:var(--panel);box-shadow:inset 0 0 0 3px var(--line),inset 0 0 0 5px var(--edge);padding:7px 12px 6px;min-width:118px}
.stat b{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);display:block;margin-bottom:3px;font-weight:normal}
.stat span{font-size:28px;line-height:1}
.stat small{color:var(--acc);font-size:17px;margin-left:4px}
#s-money{color:var(--gold)}
#buffs{display:flex;gap:6px;flex-wrap:wrap}
.buff{font-family:'Press Start 2P',monospace;font-size:8px;padding:6px 8px;background:var(--gold);color:#221;box-shadow:0 0 0 3px var(--line);animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{background:#fff3a8}}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:920px){main{grid-template-columns:1fr}}
#scene{width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;display:block;cursor:pointer;touch-action:manipulation;box-shadow:0 0 0 4px var(--line),0 0 0 8px var(--edge),0 10px 0 8px #0006;user-select:none;-webkit-user-select:none}
.box{background:var(--panel);box-shadow:inset 0 0 0 3px var(--line),inset 0 0 0 5px var(--edge);padding:12px}
#build{display:flex;align-items:center;gap:12px;margin-top:18px}
#build .binfo{flex:1;min-width:0}
#build-name{font-family:'Press Start 2P',monospace;font-size:10px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:14px;background:#15111d;box-shadow:0 0 0 2px var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--acc);width:0}
.bar.fast i{width:100%!important;background:repeating-linear-gradient(90deg,var(--acc) 0 10px,#7fd11a 10px 20px);animation:slide .4s linear infinite;background-size:20px 100%}
@keyframes slide{to{background-position:20px 0}}
#build-sub{color:var(--dim);font-size:18px;margin-top:4px}
.btn{font-family:'Press Start 2P',monospace;font-size:9px;background:var(--acc);color:#15111d;border:0;padding:10px 11px;cursor:pointer;box-shadow:inset -3px -3px 0 #0005,inset 3px 3px 0 #fff5,0 0 0 3px var(--line);white-space:nowrap;line-height:1.3}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 3px 3px 0 #0005,0 0 0 3px var(--line)}
.btn:disabled{background:#4a4458;color:#8d85a0;cursor:not-allowed;box-shadow:0 0 0 3px var(--line)}
.btn.pink{background:var(--acc2);color:#fff}
.btn.gold{background:var(--gold)}
.btn.small{font-size:8px;padding:7px 8px}
#btn-build{font-size:13px;padding:16px 18px;background:var(--acc2);color:#fff}
h2{font-family:'Press Start 2P',monospace;font-size:11px;margin:22px 0 10px;color:var(--gold);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 small{font-family:'VT323',monospace;font-size:18px;color:var(--dim)}
#orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.order{display:flex;gap:10px;align-items:center;padding:9px 10px}
.order.vip{box-shadow:inset 0 0 0 3px var(--line),inset 0 0 0 5px var(--gold)}
.order.ready{box-shadow:inset 0 0 0 3px var(--line),inset 0 0 0 5px var(--acc)}
.order .oi{flex:1;min-width:0}
.order .on{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order .or{color:var(--gold);font-size:18px}
.order .os{color:var(--dim);font-size:16px}
.order .bar{height:6px;margin-top:4px}
.empty{color:var(--dim);font-size:19px;padding:10px 2px}
#panel{position:sticky;top:10px}
#tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
#tabs button{flex:1;font-family:'Press Start 2P',monospace;font-size:9px;padding:11px 6px;background:var(--panel);color:var(--dim);border:0;cursor:pointer;box-shadow:inset 0 0 0 3px var(--line),inset 0 0 0 5px var(--edge);position:relative}
#tabs button.on{background:var(--edge);color:var(--ink)}
#tabs button .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;background:var(--acc2);box-shadow:0 0 0 2px var(--line)}
#tab{max-height:calc(100vh - 150px);overflow:auto;padding-right:4px;scrollbar-color:var(--edge) var(--line)}
@media (max-width:920px){#tab{max-height:none}#panel{position:static}}
.card{display:flex;gap:12px;align-items:center;padding:11px 12px;margin-bottom:9px}
.card .info{flex:1;min-width:0}
.card .name{font-family:'Press Start 2P',monospace;font-size:10px;margin-bottom:5px;line-height:1.35}
.card .desc{color:var(--dim);font-size:17px}
.card .meta{font-size:17px;margin-top:3px;color:var(--cyan)}
.card.active{box-shadow:inset 0 0 0 3px var(--line),inset 0 0 0 5px var(--acc)}
.card.locked .name{color:var(--gold)}
.card.mystery{opacity:.55}
.card .count{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--gold);min-width:44px;text-align:right}
.bad{color:var(--red)}.ok{color:var(--acc)}
.seg{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.seg span{color:var(--dim);font-size:18px;margin-right:4px}
.seg .btn{background:var(--panel2);color:var(--dim)}
.seg .btn.on{background:var(--cyan);color:#111}
.toggle{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-bottom:10px;cursor:pointer;font-size:18px}
.toggle input{width:20px;height:20px;accent-color:var(--acc)}
.grid-ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.up{display:flex;flex-direction:column;gap:6px;padding:11px}
.up .top{display:flex;gap:10px;align-items:center}
.up .name{font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.4}
.up .desc{color:var(--dim);font-size:17px;flex:1}
.owned{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.owned canvas{box-shadow:0 0 0 2px var(--line);background:var(--panel)}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:19px}
.stats span:nth-child(odd){color:var(--dim)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.ach{display:flex;gap:8px;align-items:center;padding:8px;font-size:16px}
.ach b{display:block;font-family:'Press Start 2P',monospace;font-size:7px;line-height:1.4;margin-bottom:2px;font-weight:normal}
.ach.no{opacity:.4}
h3{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold);margin:18px 0 9px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:30;max-width:min(360px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:center;padding:10px 12px;font-size:18px;animation:tin .25s steps(4)}
.toast b{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--gold);display:block;margin-bottom:3px;font-weight:normal}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
#modal{position:fixed;inset:0;background:#0b0812cc;display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal[hidden]{display:none}
#modal .box{max-width:460px;width:100%;text-align:center;padding:26px 22px}
#modal .mt{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--acc);line-height:1.5;margin:14px 0 10px}
#modal .mx{font-size:20px;color:var(--ink);margin-bottom:18px}
#modal canvas{margin:0 auto}
.foot{color:var(--dim);font-size:16px;margin-top:16px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AGUS<span>CONSOLAS</span></h1>
    <div id="stats">
      <div class="stat"><b>PLATA</b><span id="s-money">$0</span><small id="s-income"></small></div>
      <div class="stat"><b>REPUTACION</b><span id="s-rep">0</span></div>
      <div class="stat"><b>ARMADO/SEG</b><span id="s-rate">0</span></div>
      <div class="stat"><b>POR CLIC</b><span id="s-click">1</span></div>
    </div>
    <div id="buffs"></div>
  </header>
  <main>
    <section>
      <canvas id="scene" width="320" height="180"></canvas>
      <div id="build" class="box">
        <canvas id="build-icon" class="pix" width="16" height="12" style="width:48px;height:36px"></canvas>
        <div class="binfo">
          <div id="build-name"></div>
          <div class="bar" id="build-bar-wrap"><i id="build-bar"></i></div>
          <div id="build-sub"></div>
        </div>
        <button id="btn-build" class="btn">ARMAR</button>
      </div>
      <h2>PEDIDOS <small id="orders-info"></small></h2>
      <div id="orders"></div>
      <div class="foot">Tip: clic en la escena (o barra espaciadora) para armar · clic en un cliente para entregarle su pedido · atrapá las Raspberries doradas.</div>
    </section>
    <aside id="panel">
      <nav id="tabs">
        <button data-t="consolas">CONSOLAS</button>
        <button data-t="equipo">EQUIPO</button>
        <button data-t="mejoras">MEJORAS</button>
        <button data-t="logros">LOGROS</button>
      </nav>
      <div id="tab"></div>
    </aside>
  </main>
</div>
<div id="toasts"></div>
<div id="modal" hidden></div>

<script>
'use strict';
/* =========================================================
   DATOS
   ========================================================= */
const CONSOLES=[
 {name:'RetroPi Zero',desc:'Una Raspberry Pi Zero con emuladores de NES. El comienzo de todo.',work:10,price:15,unlock:0,rep:0},
 {name:'RetroPi 4',desc:'Raspberry Pi 4 en carcasa, dos joysticks USB y 10.000 juegos.',work:60,price:110,unlock:250,rep:5},
 {name:'PiBoy Portátil',desc:'Game Boy casera con pantalla IPS. Ideal para el bondi.',work:400,price:900,unlock:3000,rep:25},
 {name:'Bartop Arcade',desc:'Mini arcade de mesa con palanca y botones de verdad.',work:2500,price:7000,unlock:3e4,rep:80},
 {name:'Gabinete Arcade',desc:'El fichín completo, como en los arcades de antes.',work:1.5e4,price:5e4,unlock:3e5,rep:200},
 {name:'AgusDeck',desc:'Portátil tipo Steam Deck. Bootea con la cara de Agus.',work:1e5,price:3.8e5,unlock:3.5e6,rep:450},
 {name:'AgusStation 5',desc:'Consola de mesa next-gen. Viene con un mate de regalo.',work:7e5,price:3e6,unlock:4e7,rep:900},
 {name:'AgusVR',desc:'Casco de realidad virtual. Podés jugar adentro del taller de Agus.',work:5e6,price:2.4e7,unlock:5e8,rep:1800},
 {name:'HoloConsola',desc:'Proyecta los juegos en hologramas 3D arriba de la mesa.',work:4e7,price:2.1e8,unlock:6e9,rep:3500},
 {name:'Consola Cuántica',desc:'Corre todos los juegos a la vez hasta que la mirás.',work:3.5e8,price:2e9,unlock:8e10,rep:7000},
 {name:'Agus-Verso',desc:'Una consola con un universo adentro. Ahí adentro hay otro Agus armando consolas.',work:3e9,price:2e10,unlock:1e12,rep:14000},
];
const NT=CONSOLES.length;

const HELPERS=[
 {name:'Primo que ayuda',desc:'Pela cables, ceba mate y a veces ayuda.',base:15,rate:0.3,icon:'primo',ups:['Primo con ganas','Primo recibido','Primo ingeniero']},
 {name:'Soldador automático',desc:'Suelda solito mientras tomás mate.',base:120,rate:2,icon:'soldador',ups:['Estaño de calidad','Punta de cerámica','Soldadura láser']},
 {name:'Impresora 3D',desc:'Imprime carcasas día y noche.',base:1300,rate:12,icon:'impresora',ups:['Filamento PETG','Doble extrusor','Granja de impresoras']},
 {name:'Técnico contratado',desc:'Sabe lo que hace. Cobra en dólares.',base:14000,rate:70,icon:'tecnico',ups:['Capacitación','Técnicos senior','Técnicos certificados']},
 {name:'Brazo robótico',desc:'No se cansa ni pide aumento.',base:160000,rate:400,icon:'brazo',ups:['Servos nuevos','Visión artificial','Brazos gemelos']},
 {name:'Línea de montaje',desc:'Cinta transportadora llena de consolas.',base:2e6,rate:2400,icon:'linea',ups:['Cinta más rápida','Doble turno','Just in time']},
 {name:'Fábrica en Shenzhen',desc:'Tu propia fábrica al otro lado del mundo.',base:3e7,rate:15000,icon:'fabrica',ups:['Proveedor propio','Chips propios','Zona franca']},
 {name:'IA ensambladora',desc:'Una IA que solo piensa en consolas.',base:5e8,rate:1e5,icon:'ia',ups:['Más parámetros','Fine-tuning retro','Superinteligencia gamer']},
 {name:'Enjambre de nanobots',desc:'Millones de robotitos armando a nivel atómico.',base:8e9,rate:7e5,icon:'nano',ups:['Nanobots en equipo','Nanobots que se replican','Nanobots conscientes']},
 {name:'Clones de Agus',desc:'¿Qué es mejor que un Agus? Muchos Agus.',base:1.5e11,rate:5e6,icon:'clones',ups:['Clones con mate','Clones sincronizados','Agus Prime']},
];
const NH=HELPERS.length;

const UPGRADES=[
 {id:'mate1',name:'Mate cebado',desc:'Tus clics arman x2.',cost:50,icon:'mate',fx:m=>m.click*=2},
 {id:'insta',name:'Cuenta de Instagram',desc:'Llegan clientes 40% más seguido.',cost:150,icon:'phone',fx:m=>m.spawn*=1.4},
 {id:'dest',name:'Destornillador imantado',desc:'Tus clics arman x2.',cost:500,icon:'tool',fx:m=>m.click*=2},
 {id:'sillas',name:'Sillas de espera',desc:'Los clientes esperan 60% más.',cost:800,icon:'chair',fx:m=>m.patience*=1.6},
 {id:'vendedor',name:'Vendedor de mostrador',desc:'Entrega los pedidos solo, apenas hay stock.',cost:2000,icon:'cart',fx:m=>m.autoDeliver=true},
 {id:'garantia',name:'Garantía extendida',desc:'Todo se vende x1.5.',cost:4000,icon:'shield',fx:m=>m.price*=1.5},
 {id:'termo',name:'Termo de acero',desc:'Tus clics arman x3.',cost:6000,icon:'termo',fx:m=>m.click*=3},
 {id:'planif',name:'Planilla de Excel',desc:'Elige sola qué consola armar según los pedidos.',cost:9000,icon:'sheet',fx:m=>m.planner=true},
 {id:'local',name:'Local a la calle',desc:'+1 lugar en la fila y clientes +30%.',cost:20000,icon:'house',fx:m=>{m.slots++;m.spawn*=1.3}},
 {id:'ml',name:'Tienda online',desc:'Vende sola el stock que sobra, al 40% del precio.',cost:35000,icon:'box',fx:m=>m.shop=Math.max(m.shop,0.4)},
 {id:'muneca',name:'Muñeca de gamer',desc:'Cada clic suma además 5% de tu armado/seg.',cost:50000,icon:'hand',fx:m=>m.clickPct+=0.05},
 {id:'yerba',name:'Yerba premium',desc:'Todo el equipo arma x1.5.',cost:90000,icon:'mate',fx:m=>m.auto*=1.5},
 {id:'goldr',name:'Imán de Raspberries',desc:'Las Raspberries doradas aparecen x2.',cost:150000,icon:'berry',fx:m=>m.gold*=2},
 {id:'mayor',name:'Pedidos mayoristas',desc:'Los clientes piden el doble.',cost:300000,icon:'box',fx:m=>m.qty*=2},
 {id:'bizco',name:'Bizcochitos de grasa',desc:'Tus clics arman x3.',cost:800000,icon:'bizco',fx:m=>m.click*=3},
 {id:'marca',name:'Marca registrada',desc:'Todo se vende x2.',cost:2e6,icon:'star',fx:m=>m.price*=2},
 {id:'wifi',name:'Wi-Fi gratis',desc:'Los clientes esperan 60% más.',cost:4e6,icon:'wifi',fx:m=>m.patience*=1.6},
 {id:'teclado',name:'Teclado mecánico',desc:'Cada clic suma además 10% de tu armado/seg.',cost:8e6,icon:'hand',fx:m=>m.clickPct+=0.1},
 {id:'ml2',name:'MercadoLíder Platinum',desc:'La tienda online vende al 75%.',cost:1.5e7,icon:'cart',fx:m=>m.shop=Math.max(m.shop,0.75)},
 {id:'vipclub',name:'Club VIP',desc:'Vienen clientes VIP 3 veces más seguido.',cost:3e7,icon:'crown',fx:m=>m.vip*=3},
 {id:'palermo',name:'Sucursal en Palermo',desc:'+1 lugar en la fila y todo se vende x1.5.',cost:8e7,icon:'house',fx:m=>{m.slots++;m.price*=1.5}},
 {id:'aire',name:'Aire acondicionado',desc:'Todo el equipo arma x2.',cost:3e8,icon:'snow',fx:m=>m.auto*=2},
 {id:'influ',name:'Un streamer la usa en vivo',desc:'Todo se vende x2 y clientes +50%.',cost:2e9,icon:'cam',fx:m=>{m.price*=2;m.spawn*=1.5}},
 {id:'dedos',name:'Dedos biónicos',desc:'Cada clic suma además 25% de tu armado/seg.',cost:1e10,icon:'hand',fx:m=>m.clickPct+=0.25},
 {id:'cafe',name:'Cafetera italiana',desc:'Todo el equipo arma x2.',cost:5e10,icon:'coffee',fx:m=>m.auto*=2},
 {id:'export',name:'Exportación mundial',desc:'Todo se vende x3 y piden el doble.',cost:5e11,icon:'globe',fx:m=>{m.price*=3;m.qty*=2}},
 {id:'multimate',name:'Mate del multiverso',desc:'Clics y equipo x3.',cost:5e12,icon:'mate',fx:m=>{m.auto*=3;m.click*=3}},
];
HELPERS.forEach((h,i)=>h.ups.forEach((nm,k)=>{
  const need=[10,25,50][k];
  UPGRADES.push({id:`h${i}_${k}`,name:nm,desc:`${h.name}: arman x2. (Requiere ${need})`,cost:h.base*[12,150,3000][k],icon:h.icon,req:()=>S.helpers[i]>=need,fx:m=>m.helper[i]*=2});
}));
UPGRADES.sort((a,b)=>a.cost-b.cost);

const QUOTES=[
 '¿Alguien vio mi destornillador?','Esta SD ya la flasheé tres veces...','Pasame el mate.','¡Bootea! ¡BOOTEA!',
 'Le pongo unos disipadores y listo.','Este quiere jugar al Winning Eleven.','Ya viene, está compilando.',
 '¿Quién desenchufó el soldador?','Con cariño y un poco de estaño.','Le cargué todos los Mario.',
 'Esto en Mercado Libre sale el doble.','Un mate más y la termino.','¿Y si le pongo luces RGB?',
 'La fuente era de 2A, no de 3A...','sudo reboot','El Street Fighter anda joya.','Garantía de por vida... de la consola.',
];

/* =========================================================
   ESTADO
   ========================================================= */
const SAVE_KEY='agus-consolas-v1';
function fresh(){return{money:0,rep:0,earned:0,allEarned:0,sold:0,built:0,clicks:0,orders:0,angry:0,golds:0,vips:0,
  unlocked:1,target:0,progress:Array(NT).fill(0),stock:Array(NT).fill(0),helpers:Array(NH).fill(0),ups:{},ach:{},
  chips:0,franchises:0,autoPlan:true,sound:true,time:0,last:Date.now(),seenWelcome:false};}
function load(){
  try{const raw=localStorage.getItem(SAVE_KEY); if(!raw) return null; const d=JSON.parse(raw); const s=Object.assign(fresh(),d);
    for(const k of ['progress','stock']) s[k]=Array.from({length:NT},(_,i)=>+s[k][i]||0);
    s.helpers=Array.from({length:NH},(_,i)=>+s.helpers[i]||0); return s;}catch(e){return null;}
}
function save(){S.last=Date.now(); try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
let S=load()||fresh();
let M;
let T=0;
const buffs={};
function buffMult(k){return buffs[k]&&buffs[k].until>T?buffs[k].m:1;}
function computeMods(){
  const m={click:1,clickPct:0,auto:1,helper:HELPERS.map(()=>1),price:1,spawn:1,patience:1,slots:4,autoDeliver:false,planner:false,shop:0,qty:1,vip:1,gold:1};
  for(const u of UPGRADES) if(S.ups[u.id]) u.fx(m);
  const achM=1+0.02*Object.keys(S.ach).length, fr=1+0.1*S.chips;
  m.auto*=achM*fr; m.click*=achM*fr; m.price*=fr;
  M=m;
}
computeMods();
const workRate=()=>{let r=0;for(let i=0;i<NH;i++)r+=S.helpers[i]*HELPERS[i].rate*M.helper[i];return r*M.auto*buffMult('auto');};
const clickPower=()=>(M.click+M.clickPct*workRate())*buffMult('click');
const priceOf=t=>CONSOLES[t].price*M.price*(1+S.rep/1000);
function gain(v){S.money+=v;S.earned+=v;S.allEarned+=v;}

/* =========================================================
   FORMATO
   ========================================================= */
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<1000) return (n<10&&n%1)?(Math.floor(n*10)/10).toString():Math.floor(n).toString();
  let i=0; while(n>=1000&&i<SUF.length-1){n/=1000;i++;}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+SUF[i];
}

let AC=null, lastSnd={};
function tone(f,d,type='square',v=0.04,delay=0,slide=0){
  const t0=AC.currentTime+delay, o=AC.createOscillator(), gn=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0); if(slide) o.frequency.linearRampToValueAtTime(f+slide,t0+d);
  gn.gain.setValueAtTime(v,t0); gn.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(gn).connect(AC.destination); o.start(t0); o.stop(t0+d+0.02);
}
function sfx(k){
  if(!S.sound) return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();}catch(e){return;}
  const now=performance.now(); if(lastSnd[k]&&now-lastSnd[k]<(k==='click'?45:k==='build'?120:30)) return; lastSnd[k]=now;
  switch(k){
    case 'click': tone(660+Math.random()*80,0.04,'square',0.025); break;
    case 'build': tone(880,0.06,'square',0.03); tone(1320,0.08,'square',0.03,0.06); break;
    case 'coin': tone(988,0.07,'square',0.04); tone(1319,0.18,'square',0.04,0.07); break;
    case 'err': tone(180,0.15,'sawtooth',0.03); break;
    case 'angry': tone(300,0.25,'sawtooth',0.035,0,-160); break;
    case 'ui': tone(520,0.05,'triangle',0.05); break;
    case 'buy': tone(523,0.06,'square',0.035); tone(784,0.1,'square',0.035,0.06); break;
    case 'door': tone(1200,0.05,'triangle',0.04); tone(900,0.08,'triangle',0.04,0.06); break;
    case 'gold': [784,988,1175,1568].forEach((f,i)=>tone(f,0.1,'square',0.035,i*0.06)); break;
    case 'unlock': [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,0.13,'square',0.04,i*0.09)); break;
  }
}

function addWorkTo(tier,w){
  const C=CONSOLES[tier]; S.progress[tier]+=w;
  if(S.progress[tier]>=C.work){const n=Math.floor(S.progress[tier]/C.work); S.progress[tier]-=n*C.work; S.stock[tier]+=n; S.built+=n; return n;}
  return 0;
}
function doClick(x=189,y=104){
  const cp=clickPower(); S.clicks++; lastClickT=T;
  const n=addWorkTo(S.target,cp);
  float('+'+fmt(cp),x+rnd(-4,4),y-6,'#b6ff3a');
  burst(x,y,3,['#b6ff3a','#fff']);
  if(n>0){burst(189,108,10,['#ffd23f','#fff','#5ef0ff']); sfx('build');} else sfx('click');
}
function slotX(i){return 142-i*22;}
function pickTier(){
  let tot=0; const ws=[]; for(let i=0;i<S.unlocked;i++){const w=Math.pow(1.7,i); ws.push(w); tot+=w;}
  let r=Math.random()*tot; for(let i=0;i<ws.length;i++){r-=ws[i]; if(r<=0) return i;} return S.unlocked-1;
}
function orderQty(tier){
  const cap=(workRate()*30+clickPower()*5)/CONSOLES[tier].work;
  const maxQ=Math.max(1,Math.floor(cap*0.35*M.qty));
  return Math.min(1e7,1+Math.floor(Math.random()*maxQ));
}
function spawnCustomer(){
  if(queue.length>=M.slots) return;
  const tier=pickTier(), vip=Math.random()<Math.min(0.4,0.04*M.vip);
  const pat=rnd(32,42)*M.patience;
  const c={id:++cid,tier,qty:orderQty(tier),vip,pat,maxPat:pat,x:-14,state:'q',look:randLook(vip),walk:0,bobO:Math.random()*6,face:1,moving:true};
  customers.push(c); queue.push(c); addOrderCard(c); sfx('door');
  if(vip) say('¡Un cliente VIP! Paga x5.');
}
function leaveQueue(c){const i=queue.indexOf(c); if(i>=0) queue.splice(i,1); removeOrderCard(c);}
function deliver(c,auto){
  if(c.state!=='q') return false;
  if(S.stock[c.tier]<c.qty){ if(!auto){float('FALTA STOCK',c.x+5,96,'#ff5a5a'); sfx('err');} return false; }
  S.stock[c.tier]-=c.qty;
  const pay=priceOf(c.tier)*c.qty*(c.vip?5:1);
  gain(pay); S.rep+=(c.tier+1)*Math.ceil(Math.sqrt(c.qty))*(c.vip?3:1); S.sold+=c.qty; S.orders++; if(c.vip) S.vips++;
  c.state='happy'; c.face=-1;
  float('+$'+fmt(pay),c.x+5,96,'#ffd23f'); burst(c.x+5,120,8,['#ffd23f','#b6ff3a']);
  sfx('coin'); leaveQueue(c);
  if(Math.random()<0.15) say(pick(['¡Que la disfrutes!','¡Gracias, vuelva prontos!','Cualquier cosa me escribís.','Tiene garantía, eh.']),2.5);
  return true;
}
function angryLeave(c){
  c.state='angry'; c.face=-1; S.angry++;
  const lost=Math.min(S.rep,c.tier+1); S.rep-=lost;
  float(lost?'-'+fmt(lost)+' REP':'!!',c.x+5,112,'#ff5a5a'); sfx('angry'); leaveQueue(c);
  if(Math.random()<0.4) say(pick(['Uh, se fue...','¡Esperá, ya estaba!','Necesito más stock.']),2.5);
}
function plan(){
  if(!(M.planner&&S.autoPlan)) return;
  for(const c of queue) if(S.stock[c.tier]<c.qty){S.target=c.tier; return;}
  S.target=S.unlocked-1;
}
function demand(i){let d=0; for(const c of queue) if(c.tier===i) d+=c.qty; return d;}
function shopTick(){
  if(M.shop<=0) return 0; let e=0;
  for(let i=0;i<S.unlocked;i++){const ex=S.stock[i]-demand(i)-2; if(ex>0){S.stock[i]-=ex; const v=priceOf(i)*ex*M.shop; gain(v); S.sold+=ex; e+=v;}}
  return e;
}
function collectGold(){
  S.golds++; sfx('gold'); burst(gold.x+5,gold.y+5,25,['#ffd23f','#fff6a0','#fff']);
  const r=Math.random(), wr=workRate();
  if(r<0.3){buffs.click={m:7,until:T+15,name:'FRENESÍ: CLIC x7'}; toast('¡Raspberry dorada!','Frenesí: tus clics arman x7 por 15 s.','berry'); say('¡A toda máquina!');}
  else if(r<0.55&&wr>0){buffs.auto={m:3,until:T+30,name:'MATE TURBO: EQUIPO x3'}; toast('¡Raspberry dorada!','Mate turbo: el equipo arma x3 por 30 s.','berry'); say('¡Mate turbo para todos!');}
  else if(r<0.8){const v=Math.max(50,S.money*0.12+incRate*90); gain(v); toast('¡Raspberry dorada!',`Encontraste $${fmt(v)} en un cajón.`,'berry'); say('¡Plata en el cajón!');}
  else {const i=S.target, n=Math.max(3,Math.ceil(wr*60/CONSOLES[i].work)); S.stock[i]+=n; toast('¡Raspberry dorada!',`Llegó un contenedor: +${fmt(n)} ${CONSOLES[i].name}.`,'berry'); say('¡Llegó un contenedor!');}
  gold=null;
}
function unlock(i){
  const C=CONSOLES[i]; if(i!==S.unlocked||S.money<C.unlock||S.rep<C.rep) return;
  S.money-=C.unlock; S.unlocked++; S.target=i; sfx('unlock'); say(`¡Ahora armo ${C.name}!`,4);
  checkAch(); renderTab();
  showModal(consoleIcon(i,8),'¡NUEVA CONSOLA!',`<b>${C.name}</b><br>${C.desc}`,'¡A ARMAR!');
}
function helperCost(i,n){const h=HELPERS[i]; return h.base*Math.pow(1.15,S.helpers[i])*(Math.pow(1.15,n)-1)/0.15;}
function maxBuy(i){const c0=HELPERS[i].base*Math.pow(1.15,S.helpers[i]); if(S.money<c0) return 0; return Math.floor(Math.log(S.money*0.15/c0+1)/Math.log(1.15));}
let buyAmt=1;
function buyN(i){return buyAmt==='max'?Math.max(1,maxBuy(i)):buyAmt;}
function buyHelper(i){
  const n=buyN(i), c=helperCost(i,n); if(S.money<c) return;
  S.money-=c; S.helpers[i]+=n; sfx('buy');
  if(S.helpers[i]===n) say(pick([`¡Bienvenido, ${HELPERS[i].name}!`,'¡Más manos, más consolas!']));
}
function buyUpgrade(u){
  if(S.ups[u.id]||S.money<u.cost) return;

}
function visibleHelpers(){const out=[]; for(let i=0;i<NH;i++){if(i===0||S.helpers[i]>0||S.helpers[i-1]>0||S.earned>=HELPERS[i].base*0.4) out.push(i); else break;} return out;}

function potentialChips(){return Math.floor(Math.cbrt(S.allEarned/1e8));}
function franchise(){
  const gainC=potentialChips()-S.chips; if(gainC<1||S.earned<1e9) return;
  const keep={chips:S.chips+gainC,ach:S.ach,allEarned:S.allEarned,clicks:S.clicks,sold:S.sold,built:S.built,orders:S.orders,angry:S.angry,golds:S.golds,vips:S.vips,

function removeOrderCard(c){const o=orderEls.get(c.id); if(o){o.card.remove(); orderEls.delete(c.id);}}
function updateOrders(){
  for(const o of orderEls.values()){
    const c=o.c, ok=S.stock[c.tier]>=c.qty, p=Math.max(0,c.pat/c.maxPat);
    o.rew.textContent='$'+fmt(priceOf(c.tier)*c.qty*(c.vip?5:1));
    o.st.innerHTML=`Stock: <span class="${ok?'ok':'bad'}">${fmt(S.stock[c.tier])}/${fmt(c.qty)}</span>`;
    o.bar.style.width=(p*100)+'%'; o.bar.style.background=p>0.5?'#40c040':p>0.25?'#f0a020':'#e0303a';
    o.b.disabled=!ok; o.card.classList.toggle('ready',ok&&!c.vip);
  }
  $('orders-info').textContent=`${queue.length}/${M.slots} en la fila`+(M.autoDeliver?' · el vendedor entrega solo':'')+(M.shop?` · tienda online al ${Math.round(M.shop*100)}%`:'');
  let em=$('orders').querySelector('.empty');
  if(!queue.length&&!em){em=el('div','empty','No hay nadie en la fila... ya van a venir.'); $('orders').append(em);}
  else if(queue.length&&em) em.remove();
}

// tabs
let tab='consolas', tabSig='', tabUpd=[];
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; sfx('ui'); renderTab();});
function calcSig(){return [tab,S.unlocked,visibleHelpers().join(','),visibleUpgrades().map(u=>u.id).join(','),M.planner,Object.keys(S.ach).length,S.chips,buyAmt,S.autoPlan].join('|');}
function renderTab(){
  const box=$('tab'), sc=box.scrollTop; box.innerHTML=''; tabUpd=[];
  ({consolas:renderConsolas,equipo:renderEquipo,mejoras:renderMejoras,logros:renderLogros})[tab](box);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  tabSig=calcSig(); tabUpd.forEach(f=>f()); box.scrollTop=sc;
}
function renderConsolas(box){
  if(M.planner){
    const l=el('label','toggle box'); const cb=el('input'); cb.type='checkbox'; cb.checked=S.autoPlan;
    cb.onchange=()=>{S.autoPlan=cb.checked; sfx('ui'); renderTab();};
    l.append(cb,el('span',null,'Modo automático: la Planilla de Excel elige qué armar')); box.append(l);
  }
  for(let i=0;i<Math.min(NT,S.unlocked+2);i++){
    const C=CONSOLES[i], card=el('div','card box');
    if(i<S.unlocked){
      card.append(consoleIcon(i,3));
      const info=el('div','info',`<div class="name">${C.name}</div><div class="desc">${C.desc}</div>`), meta=el('div','meta'); info.append(meta); card.append(info);
      const b=el('button','btn','ARMAR'); b.onclick=()=>{S.target=i; if(M.planner&&S.autoPlan){S.autoPlan=false; renderTab();} sfx('ui');}; card.append(b);
      tabUpd.push(()=>{meta.textContent=`$${fmt(priceOf(i))} c/u · trabajo ${fmt(C.work)} · stock ${fmt(S.stock[i])}`; const act=S.target===i; card.classList.toggle('active',act); b.textContent=act?'ARMANDO':'ARMAR'; b.disabled=act;});
    } else if(i===S.unlocked){
      card.classList.add('locked'); card.append(consoleIcon(i,3,true));
      const info=el('div','info',`<div class="name">${C.name}</div><div class="desc">${C.desc}</div>`), meta=el('div','meta'); info.append(meta); card.append(info);
      const b=el('button','btn gold','DESBLOQUEAR'); b.onclick=()=>unlock(i); card.append(b);
      tabUpd.push(()=>{meta.innerHTML=`Necesitás <span class="${S.money>=C.unlock?'ok':'bad'}">$${fmt(C.unlock)}</span> y <span class="${S.rep>=C.rep?'ok':'bad'}">${fmt(C.rep)} de reputación</span>`; b.disabled=S.money<C.unlock||S.rep<C.rep;});
    } else {
      card.classList.add('mystery'); card.append(consoleIcon(i,3,true));
      card.append(el('div','info','<div class="name">???</div><div class="desc">Seguí creciendo para descubrirla.</div>'));
    }
    box.append(card);
  }
  if(S.unlocked>=NT) box.append(el('div','card box','<div class="info"><div class="name">¡Tenés todas las consolas!</div><div class="desc">Andá a Logros y abrí una franquicia para seguir creciendo.</div></div>'));
}
function renderEquipo(box){
  const seg=el('div','seg'); seg.append(el('span',null,'Comprar:'));
  for(const a of [1,10,'max']){const b=el('button','btn small'+(buyAmt===a?' on':''),a==='max'?'MAX':'×'+a); b.onclick=()=>{buyAmt=a; sfx('ui'); renderTab();}; seg.append(b);}
  box.append(seg);
  const vis=visibleHelpers();
  for(const i of vis){
    const h=HELPERS[i], card=el('div','card box');
    card.append(spriteIcon(h.icon,5));
    const info=el('div','info',`<div class="name">${h.name}</div><div class="desc">${h.desc}</div>`), meta=el('div','meta'); info.append(meta); card.append(info);
    const cnt=el('div','count'); card.append(cnt);
    const b=el('button','btn'); b.onclick=()=>buyHelper(i); card.append(b);
    tabUpd.push(()=>{
      const each=h.rate*M.helper[i]*M.auto, n=buyN(i), c=helperCost(i,n);
      meta.textContent=`+${fmt(each)}/s c/u · total ${fmt(each*S.helpers[i])}/s`;
      cnt.textContent=S.helpers[i]; b.innerHTML=`×${n}<br>$${fmt(c)}`; b.disabled=S.money<c;
    });
    box.append(card);
  }
  const nx=vis.length; if(nx<NH){const card=el('div','card box mystery'); card.append(spriteIcon('lock',5)); card.append(el('div','info',`<div class="name">???</div><div class="desc">Se revela cuando ganes $${fmt(HELPERS[nx].base*0.4)}.</div>`)); box.append(card);}
}
function renderMejoras(box){
  const vis=visibleUpgrades();
  if(!vis.length) box.append(el('div','empty','No hay mejoras disponibles todavía. ¡Seguí vendiendo!'));
  const grid=el('div','grid-ups');
  for(const u of vis){
    const card=el('div','up box'), top=el('div','top'); top.append(spriteIcon(u.icon,4), el('div','name',u.name));
    card.append(top, el('div','desc',u.desc));
    const b=el('button','btn','$'+fmt(u.cost)); b.onclick=()=>buyUpgrade(u); card.append(b);
    tabUpd.push(()=>{b.disabled=S.money<u.cost;});
    grid.append(card);
  }
  box.append(grid);
  const own=UPGRADES.filter(u=>S.ups[u.id]);
  if(own.length){box.append(el('h3',null,`COMPRADAS (${own.length})`)); const o=el('div','owned'); own.forEach(u=>{const c=spriteIcon(u.icon,4); c.title=`${u.name}: ${u.desc}`; o.append(c);}); box.append(o);}
}
function renderLogros(box){
  box.append(el('h3',null,'ESTADISTICAS'));
  const st=el('div','stats box'); box.append(st);
  tabUpd.push(()=>{st.innerHTML=[
    ['Plata ganada (esta partida)','$'+fmt(S.earned)],['Plata ganada (total)','$'+fmt(S.allEarned)],['Consolas armadas',fmt(S.built)],
    ['Consolas vendidas',fmt(S.sold)],['Pedidos entregados',fmt(S.orders)],['Clics',fmt(S.clicks)],['Raspberries doradas',fmt(S.golds)],
    ['Clientes enojados',fmt(S.angry)],['Franquicias',fmt(S.chips)],['Tiempo jugado',Math.floor(S.time/3600)+'h '+Math.floor(S.time%3600/60)+'m'],
  ].map(([a,b])=>`<span>${a}</span><span>${b}</span>`).join('');});
  box.append(el('h3',null,'FRANQUICIAS'));
  const fr=el('div','card box'); fr.append(spriteIcon('chip',5));
  const fi=el('div','info'); fr.append(fi); const fb=el('button','btn pink','FRANQUICIAR'); fb.onclick=()=>{
    if(fb.dataset.c){franchise(); return;} fb.dataset.c='1'; fb.textContent='¿SEGURO?'; setTimeout(()=>{fb.dataset.c=''; fb.textContent='FRANQUICIAR';},3000);};
  fr.append(fb); box.append(fr);
  tabUpd.push(()=>{const gc=potentialChips()-S.chips, can=gc>=1&&S.earned>=1e9;
    fi.innerHTML=`<div class="name">Vender la empresa</div><div class="desc">Reiniciás todo pero ganás franquicias: +10% a clics, equipo y precios cada una. Tenés ${S.chips}.</div><div class="meta">${can?`Ganarías +${gc} franquicias`:'Necesitás ganar $1B en esta partida'+(gc<1&&S.earned>=1e9?' y más plata total':'')}</div>`;
    fb.disabled=!can;});
  const n=Object.keys(S.ach).length;
  box.append(el('h3',null,`LOGROS ${n}/${ACH.length} (+${n*2}%)`));
  const grid=el('div','achs');
  for(const[id,nm,d] of ACH){const a=el('div','ach box'+(S.ach[id]?'':' no')); a.append(spriteIcon(S.ach[id]?'trophy':'lock',3)); a.append(el('div',null,`<b>${nm}</b>${d}`)); grid.append(a);}
  box.append(grid);
  box.append(el('h3',null,'OPCIONES'));
  const op=el('div','seg');
  const sb=el('button','btn small'+(S.sound?' on':''),S.sound?'SONIDO: SI':'SONIDO: NO'); sb.onclick=()=>{S.sound=!S.sound; renderTab(); sfx('ui');};
  const rb=el('button','btn small','BORRAR PARTIDA'); rb.style.background='#8a1a22'; rb.style.color='#fff';
  rb.onclick=()=>{if(rb.dataset.c){localStorage.removeItem(SAVE_KEY); S=fresh(); S.seenWelcome=true; customers=[]; queue=[]; $('orders').innerHTML=''; orderEls.clear(); computeMods(); renderTab(); return;} rb.dataset.c='1'; rb.textContent='¿SEGURO? CLIC OTRA VEZ'; setTimeout(()=>{rb.dataset.c=''; rb.textContent='BORRAR PARTIDA';},3000);};
  op.append(sb,rb); box.append(op);
}

let incRate=0, lastEarned=S.allEarned;
function updateUI(){
  $('s-money').textContent='$'+fmt(S.money);
  $('s-income').textContent=incRate>0.05?'+$'+fmt(incRate)+'/s':'';
  $('s-rep').textContent=fmt(S.rep);
  $('s-rate').textContent=fmt(workRate());
  $('s-click').textContent=fmt(clickPower());
  const C=CONSOLES[S.target], ups=workRate()/C.work;
  $('build-name').textContent='ARMANDO: '+C.name+(M.planner&&S.autoPlan?' (AUTO)':'');
  const bw=$('build-bar-wrap'); bw.classList.toggle('fast',ups>4);
  $('build-bar').style.width=(Math.min(1,S.progress[S.target]/C.work)*100)+'%';
  $('build-sub').textContent=(ups>4?`${fmt(ups)} por segundo`:`${fmt(S.progress[S.target])} / ${fmt(C.work)} de trabajo`)+` · en stock: ${fmt(S.stock[S.target])}`;
  const bi=$('build-icon').getContext('2d'); bi.clearRect(0,0,16,12); drawConsole(bi,S.target,0,0,T);
  const bf=$('buffs'); const act=Object.values(buffs).filter(b=>b.until>T);
  bf.innerHTML=act.map(b=>`<div class="buff">${b.name} ${Math.ceil(b.until-T)}s</div>`).join('');
  updateOrders();
  const dot=visibleUpgrades().some(u=>S.money>=u.cost), mb=document.querySelector('#tabs [data-t=mejoras]');
  if(!!mb.querySelector('.dot')!==dot){ if(dot) mb.append(el('i','dot')); else mb.querySelector('.dot').remove(); }
  if(calcSig()!==tabSig) renderTab(); else tabUpd.forEach(f=>f());
}

/* =========================================================
   INPUT
   ========================================================= */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(gold){const gy=gold.y+Math.sin(gold.t*3)*6; if(x>gold.x-5&&x<gold.x+17&&y>gy-5&&y<gy+17){collectGold(); return;}}
  for(const c of queue) if(x>=c.x-5&&x<=c.x+15&&y>=98&&y<=160){deliver(c,false); return;}
  doClick(x,y);
});
$('btn-build').addEventListener('click',()=>doClick());
document.addEventListener('keydown',e=>{if(e.code==='Space'&&$('modal').hidden){e.preventDefault(); if(!e.repeat) doClick();}});
document.addEventListener('keyup',e=>{if(e.code==='Space') e.preventDefault();});

/* =========================================================
   LOOP
   ========================================================= */
function offline(sec){
  sec=Math.min(sec,8*3600); const wr=workRate(); if(wr<=0) return;
  const tier=(M.planner&&S.autoPlan)?S.unlocked-1:S.target;
  const n=addWorkTo(tier,wr*sec), e=shopTick();
  if(n>0) toast('Mientras no estabas...',`Tu equipo armó ${fmt(n)} ${CONSOLES[tier].name}`+(e>0?` y la tienda online vendió $${fmt(e)}.`:'.'),'primo');
}
let spawnT=2, uiAcc=0, secAcc=0, planAcc=0, delivAcc=0, saveAcc=0;
function update(dt){
  T+=dt; S.time+=dt;
  const w=workRate()*dt;
  if(w>0){const n=addWorkTo(S.target,w); if(n>0&&T-lastSparkT>0.35){lastSparkT=T; burst(189,108,5,['#ffd23f','#5ef0ff']);}}
  // clientes
  spawnT-=dt; if(spawnT<=0){spawnCustomer(); spawnT=rnd(0.6,1.4)*8/M.spawn;}
  for(const c of customers){
    let tx; if(c.state==='q'){tx=slotX(queue.indexOf(c)); c.pat-=dt; if(c.pat<=0) angryLeave(c);} if(c.state!=='q') tx=-30;
    const dx=tx-c.x, sp=c.state==='q'?45:60;
    if(Math.abs(dx)>0.5){c.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt); c.walk+=dt; c.moving=true; if(c.state==='q') c.face=Math.sign(dx);} else {c.moving=false; if(c.state==='q') c.face=1;}
  }
  customers=customers.filter(c=>c.state==='q'||c.x>-29);
  delivAcc+=dt; if(M.autoDeliver&&delivAcc>0.4){delivAcc=0; for(const c of [...queue]) if(c.x>=slotX(queue.indexOf(c))-2&&deliver(c,true)) break;}
  planAcc+=dt; if(planAcc>0.5){planAcc=0; plan();}
  secAcc+=dt; if(secAcc>=1){secAcc-=1; shopTick(); incRate=incRate*0.75+(S.allEarned-lastEarned)*0.25; lastEarned=S.allEarned; checkAch();}
  // raspberry dorada
  if(!gold){nextGold-=dt*M.gold; if(nextGold<=0){gold={x:-14,y:rnd(14,70),t:0}; nextGold=rnd(70,160);}}
  else {gold.t+=dt; gold.x+=dt*22; if(gold.x>W+14) gold=null;}
  // frases
  nextQuote-=dt; if(nextQuote<=0){say(pick(QUOTES)); nextQuote=rnd(18,40);}
  for(const f of floats){f.y-=18*dt; f.life-=dt;} floats=floats.filter(f=>f.life>0);
  for(const p of parts){p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt; p.life-=dt;} parts=parts.filter(p=>p.life>0);
  uiAcc+=dt; if(uiAcc>0.1){uiAcc=0; updateUI();}
  saveAcc+=dt; if(saveAcc>5){saveAcc=0; save();}
}
let lastTs=performance.now();
function frame(ts){
  let dt=(ts-lastTs)/1000; lastTs=ts;
  if(dt>3){offline(dt); dt=0;}
  update(Math.min(dt,0.25)); draw(); requestAnimationFrame(frame);
}

// arranque
if(S.seenWelcome){const away=(Date.now()-S.last)/1000; if(away>10) offline(away);}
renderTab(); updateUI();
if(!S.seenWelcome){
  S.seenWelcome=true;
  const ic=iconCanvas(x=>drawConsole(x,0,0,0,0),16,12,8);
  showModal(ic,'AGUS CONSOLAS','Agus arma consolas con Raspberry Pi para vender.<br><br>Hacé <b>clic</b> para armar, <b>entregá</b> los pedidos antes de que los clientes se cansen, contratá ayudantes y desbloqueá consolas cada vez más locas.','¡A LABURAR!');
}
setTimeout(()=>say('¡Buenas! ¿Armamos unas consolas?'),600);
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden) save();});
requestAnimationFrame(frame);
</script>
